<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>傷つかない招待アプリ リーガル文書一覧</title>
  <style>
  :root {
    color-scheme: light;
    --bg: #f6efe7;
    --paper: rgba(255, 255, 255, 0.94);
    --text: #2f261f;
    --muted: #70645b;
    --border: #e3d4c6;
    --accent: #7a5a43;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
    background: linear-gradient(180deg, #fbf7f2 0%, var(--bg) 100%);
    color: var(--text);
    line-height: 1.75;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }
  .shell {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 28px 22px;
    box-shadow: 0 18px 40px rgba(42, 30, 18, 0.08);
  }
  .toplink {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    color: var(--accent);
    text-decoration: none;
    font-size: 14px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 4vw, 38px);
    line-height: 1.25;
  }
  p {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 14.5px;
  }
  .links {
    display: grid;
    gap: 14px;
    margin-top: 28px;
  }
  .card {
    display: block;
    padding: 18px 18px 16px;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: #fff;
    color: inherit;
    text-decoration: none;
  }
  .card strong {
    display: block;
    font-size: 16px;
    margin-bottom: 6px;
  }
  .card span {
    color: var(--muted);
    font-size: 14px;
  }
  a { color: var(--accent); }
  @media (max-width: 640px) {
    .shell { padding: 22px 16px; border-radius: 22px; }
    main { padding: 28px 14px 48px; }
  }
  </style>
</head>
<body>
  <main>
    <article class="shell">
      <a class="toplink" href="./index.html">← LPへ戻る</a>
      <h1>リーガル文書一覧</h1>
      <p>傷つかない招待アプリに関する利用規約、プライバシーポリシー、子どもの安全基準を掲載しています。</p>
      <nav class="links" aria-label="リーガル文書一覧">
        <a class="card" href="./terms.html">
          <strong>利用規約</strong>
          <span>最終更新日: 2026-05-03</span>
        </a>
        <a class="card" href="./privacy-policy.html">
          <strong>プライバシーポリシー</strong>
          <span>最終更新日: 2026-05-03</span>
        </a>
        <a class="card" href="./child-safety.html">
          <strong>子どもの安全基準</strong>
          <span>最終更新日: 2026-08-02</span>
        </a>
      </nav>
    </article>
  </main>
</body>
</html>
